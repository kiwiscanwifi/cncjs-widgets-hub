<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Custom Widget Template</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #181818;
            color: #ddd;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            font-size: 11px;
            padding: 8px 10px;
            overflow: hidden;
            user-select: none;
        }
        .widget-panel {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .widget-header-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #222;
            padding: 5px 8px;
            border-radius: 4px;
            border: 1px solid #333;
        }
        .widget-btn {
            background: #2980b9;
            color: #fff;
            border: none;
            padding: 5px 10px;
            border-radius: 3px;
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.15s ease;
        }
        .widget-btn:hover { background: #3498db; }
        .widget-btn:active { transform: scale(0.97); }
        .telemetry-text {
            font-family: Consolas, monospace;
            font-size: 10px;
            color: #2ecc71;
        }
    </style>
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="widget-panel">
        <div class="widget-header-row">
            <span>Machine Status:</span>
            <span id="telemetry" class="telemetry-text">Idle</span>
        </div>
        <button id="btn-action" class="widget-btn">Send Test Command</button>
    </div>

    <script>
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('token') || '';
        let port = '';

        // 1. Precise 0ms Auto-Resizing Engine
        function updateHeight() {
            const panel = document.querySelector('.widget-panel');
            let h = 80;
            if (panel) {
                const rect = panel.getBoundingClientRect();
                h = Math.ceil(rect.height + 16);
            } else {
                h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight, 80);
            }
            if (window.frameElement) {
                window.frameElement.style.height = h + 'px';
            }
            window.parent.postMessage({
                token: token,
                action: {
                    type: 'resize',
                    payload: { height: h, scrollHeight: h }
                }
            }, '*');
        }
        window.addEventListener('load', updateHeight);
        if (typeof ResizeObserver !== 'undefined') {
            const ro = new ResizeObserver(updateHeight);
            ro.observe(document.body);
            const p = document.querySelector('.widget-panel');
            if (p) ro.observe(p);
        }
        setTimeout(updateHeight, 50);
        setTimeout(updateHeight, 200);

        // 2. Shared Socket.io Connection
        let socket = null;
        if (window.parent && window.parent.CNCjsHooks && window.parent.CNCjsHooks.getSocket) {
            socket = window.parent.CNCjsHooks.getSocket();
        }
        if (!socket && typeof io !== 'undefined') {
            socket = io.connect('', { query: 'token=' + encodeURIComponent(token) });
        }

        if (socket && socket.on) {
            socket.on('serialport:open', function(options) {
                if (options && options.port) port = options.port;
                document.getElementById('telemetry').innerText = 'Connected: ' + port;
            });
            socket.on('controller:state', function(type, state) {
                if (state && state.status && state.status.activeState) {
                    document.getElementById('telemetry').innerText = state.status.activeState;
                }
            });
        }

        document.getElementById('btn-action').addEventListener('click', function() {
            if (window.parent && window.parent.CNCjsHooks && window.parent.CNCjsHooks.command) {
                window.parent.CNCjsHooks.command('gcode', '?');
            } else if (socket && port) {
                socket.emit('command', port, 'gcode', '?');
            }
        });
    })();
    </script>
</body>
</html>
