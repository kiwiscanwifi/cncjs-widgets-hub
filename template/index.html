<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Custom Widget Template</title>
    <link rel="stylesheet" href="/widgets/common/widget-framework.css?v=1.2.0">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="cnc-panel">
        <div class="cnc-row-between status-row">
            <span>Machine Status:</span>
            <span id="telemetry" class="cnc-dro">Idle</span>
        </div>
        <button id="btn-action" class="cnc-btn cnc-btn-primary cnc-btn-block">Send Test Command</button>
    </div>

    <script>
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        let token = urlParams.get('token') || '';
        let port = '';

        // 1. Precise 0ms Auto-Resizing Engine
        function updateHeight() {
            const panel = document.querySelector('.cnc-panel');
            let h = 80;
            if (panel) {
                const rect = panel.getBoundingClientRect();
                h = Math.ceil(rect.height + 16);
            } else {
                h = Math.max(document.body.scrollHeight, document.documentElement.scrollHeight, 80);
            }
            if (window.frameElement) {
                window.frameElement.style.height = h + 'px';
            }
            window.parent.postMessage({
                token: token,
                action: {
                    type: 'resize',
                    payload: { height: h, scrollHeight: h }
                }
            }, '*');
        }
        window.addEventListener('load', updateHeight);
        if (typeof ResizeObserver !== 'undefined') {
            const ro = new ResizeObserver(updateHeight);
            ro.observe(document.body);
            const p = document.querySelector('.cnc-panel');
            if (p) ro.observe(p);
        }
        setTimeout(updateHeight, 50);
        setTimeout(updateHeight, 200);

        // 2. Shared Socket.io Connection
        let socket = null;
        if (window.parent && window.parent.CNCjsHooks && window.parent.CNCjsHooks.getSocket) {
            socket = window.parent.CNCjsHooks.getSocket();
        }
        if (!socket && typeof io !== 'undefined') {
            socket = io.connect('', { query: 'token=' + encodeURIComponent(token) });
        }

        if (socket && socket.on) {
            socket.on('serialport:open', function(options) {
                if (options && options.port) port = options.port;
                document.getElementById('telemetry').innerText = 'Connected: ' + port;
            });
            socket.on('controller:state', function(type, state) {
                if (state && state.status && state.status.activeState) {
                    document.getElementById('telemetry').innerText = state.status.activeState;
                }
            });
        }

        document.getElementById('btn-action').addEventListener('click', function() {
            if (window.parent && window.parent.CNCjsHooks && window.parent.CNCjsHooks.command) {
                window.parent.CNCjsHooks.command('gcode', '?');
            } else if (socket && port) {
                socket.emit('command', port, 'gcode', '?');
            }
        });
    })();
    </script>
</body>
</html>
