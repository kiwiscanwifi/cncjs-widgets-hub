<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Touch Probe Status & Probe Cycle</title>
    <link rel="stylesheet" href="/widgets/common/widget-framework.css?v=1.2.0">
    <script src="/socket.io/socket.io.js"></script>
</head>
<body>
    <div class="probe-panel">
        <div class="status-row">
            <div class="status-left">
                <div id="probe-led" class="led-dot"></div>
                <span id="probe-status-text" class="status-label">INITIALIZING</span>
            </div>
            <div id="probe-telemetry" class="status-right">Z: --</div>
        </div>

        <div class="controls-row">
            <button id="btn-probe" class="btn btn-test" title="Probes down up to 50mm toward workpiece at 80mm/min using G38.2">
                &#9660; Test Probe Z (50mm)
            </button>
            <button id="btn-stop" class="btn btn-stop" title="Emergency Stop / Halt Motion">
                &#9632; STOP
            </button>
        </div>

        <div id="probe-msg" class="msg-line">Connecting to machine controller...</div>
    </div>

    <script>
    (function() {
        const led = document.getElementById('probe-led');
        const statusText = document.getElementById('probe-status-text');
        const telemText = document.getElementById('probe-telemetry');
        const msgText = document.getElementById('probe-msg');
        const btnProbe = document.getElementById('btn-probe');
        const btnStop = document.getElementById('btn-stop');

        
        // Cross-Widget API Event Bus
        const widgetBus = window.BroadcastChannel ? new BroadcastChannel('cncjs:widgets') : null;
        function emitProbeEvent(topic, data) {
            if (widgetBus) {
                widgetBus.postMessage({
                    source: 'probe-widget',
                    topic: topic,
                    payload: data,
                    timestamp: Date.now()
                });
            }
        }

        let port = '/dev/ttyACM0';
        let token = '';
        let isProbing = false;
        let currentZ = null;
        let machineLimits = { zmin: 0, zmax: 75 }; // Safe bounds for Vertigo MX1

        // Extract token from URL
        const urlParams = new URLSearchParams(window.location.search);
        token = urlParams.get('token') || '';

        // Auto-size height inside CNCjs iframe
        function updateHeight() {
            const panel = document.querySelector('.probe-panel');
            let h = 84;
            if (panel) {
                const rect = panel.getBoundingClientRect();
                h = Math.ceil(rect.height + 14); // 6px padding top + 6px padding bottom + 2px buffer
            } else {
                h = Math.max(document.body.scrollHeight || 70, document.documentElement.scrollHeight || 70);
            }
            if (window.frameElement) {
                window.frameElement.style.height = h + 'px';
            }
            window.parent.postMessage({
                token: token,
                action: {
                    type: 'resize',
                    payload: { height: h, scrollHeight: h }
                }
            }, '*');
        }
        window.addEventListener('load', updateHeight);
        if (typeof ResizeObserver !== 'undefined') {
            const ro = new ResizeObserver(updateHeight);
            ro.observe(document.body);
            const p = document.querySelector('.probe-panel');
            if (p) ro.observe(p);
        }
        setTimeout(updateHeight, 50);
        setTimeout(updateHeight, 150);
        setTimeout(updateHeight, 500);

        // Listen for parent postMessage from CNCjs Custom Widget
        window.addEventListener('message', function(event) {
            const data = event.data || {};
            if (data.token) {
                token = data.token;
            }
            if (data.action && data.action.type === 'change') {
                if (data.action.payload && data.action.payload.port) {
                    port = data.action.payload.port;
                }
            }
        });

        // Initialize Socket.io connection (Re-use shared parent socket if inside CNCjs)
        let isSharedSocket = false;
        let socket = null;

        if (window.parent && window.parent.CNCjsHooks && window.parent.CNCjsHooks.getSocket) {
            const shared = window.parent.CNCjsHooks.getSocket();
            if (shared) {
                socket = shared;
                isSharedSocket = true;
                msgText.innerText = 'Online (Shared Socket)';
            }
        }

        if (!socket && typeof io !== 'undefined') {
            socket = io(window.location.origin, {
                transports: ['websocket'],
                query: { token: token }
            });
        }

        function joinRoom() {
            // Shared parent socket is already registered to serialport room by CNCjs
            if (isSharedSocket) return;
            if (socket && port) {
                socket.emit('open', port, {
                    controllerType: 'Smoothie',
                    baudrate: 115200
                }, function(err) {
                    if (err) {
                        msgText.innerText = 'Port open error: ' + err;
                    } else {
                        msgText.innerText = 'Connected to Smoothie (' + port + ')';
                    }
                });
            }
        }

        if (socket && socket.on) {
            socket.on('connect', function() {
                msgText.innerText = 'Socket connected. Syncing...';
                joinRoom();
                updateHeight();
            });
        }

        socket.on('serialport:open', function(options) {
            if (options && options.port) {
                port = options.port;
            }
            msgText.innerText = 'Online: ' + port;
        });

        // Watch controller state for real-time Z DRO coordinate
        socket.on('controller:state', function(type, state) {
            if (state && state.status) {
                const pos = state.status.mpos || state.status.wpos || {};
                if (pos.z !== undefined) {
                    currentZ = parseFloat(pos.z);
                    telemText.innerText = 'Z: ' + currentZ.toFixed(2) + ' mm';
                }
            }
        });

        // Parse incoming serial data
        socket.on('serialport:read', function(data) {
            if (typeof data !== 'string') return;
            const lower = data.toLowerCase();

            // Detect Probe Trigger State
            // Smoothie output: "X_min:0 Y_max:0 Z_max:0 pins- ... Probe: 1" or "Probe: 0"
            if (lower.indexOf('probe: 1') !== -1 || lower.indexOf('z_min: 1') !== -1) {
                led.className = 'led-dot triggered';
                statusText.className = 'status-label triggered';
                statusText.innerText = 'TOUCHING (CLOSED)'; emitProbeEvent('probe:state', { state: 'CLOSED', touched: true });
            } else if (lower.indexOf('probe: 0') !== -1 || lower.indexOf('z_min: 0') !== -1) {
                led.className = 'led-dot open';
                statusText.className = 'status-label open';
                statusText.innerText = 'OPEN (CLEAR)'; emitProbeEvent('probe:state', { state: 'OPEN', touched: false });
            }

            // Detect probe completion or alarm
            if (lower.indexOf('[prb:') !== -1 || lower.indexOf('ok') !== -1) {
                if (isProbing && lower.indexOf('[prb:') !== -1) {
                    msgText.innerText = 'Contact made! ' + data.trim();
                    isProbing = false;
                    btnProbe.disabled = false;
                }
            }
            if (lower.indexOf('alarm') !== -1 || lower.indexOf('error') !== -1) {
                isProbing = false;
                btnProbe.disabled = false;
                msgText.innerText = 'Alarm: ' + data.trim();
            }
        });

        // Test Probe Z Button Click Handler
        btnProbe.addEventListener('click', function() {
            if (!port || !socket.connected) {
                alert('Machine port is not connected.');
                return;
            }

            // Safety Check: Check if probe circuit is already closed before moving!
            if (statusText.innerText.indexOf('TOUCHING') !== -1) {
                alert('Safety Interlock: Probe circuit is ALREADY in contact (closed). Clear the plate or bit before probing!');
                return;
            }

            // Safety Calculation: 50mm max stroke downwards
            // Command standard straight probe cycle toward workpiece: G38.2 Z-50 F80
            // Stops instantly on electrical contact; signals alarm if 50mm reached without contact.
            isProbing = true;
            btnProbe.disabled = true;
            msgText.innerText = 'Probing down 50mm @ 80mm/min...';

            // Send standard safe probe sequence:
            // G91 (relative positioning)
            // G38.2 Z-50 F80 (probe downward up to 50mm, stop on contact)
            // G90 (restore absolute positioning)
            socket.emit('writeln', port, 'G91');
            socket.emit('writeln', port, 'G38.2 Z-50 F80');
            socket.emit('writeln', port, 'G90');
        });

        // Emergency Stop / Halt Button Click Handler
        btnStop.addEventListener('click', function() {
            if (!port || !socket.connected) return;
            // Send Smoothieware & Grbl emergency stop / feed hold commands:
            // 0x85 (Smoothieware abort), ! (Feed Hold), M112 (Emergency Stop)
            socket.emit('writeln', port, '!');
            socket.emit('writeln', port, 'M112');
            isProbing = false;
            btnProbe.disabled = false;
            msgText.innerText = 'STOP commanded (M112 / Feed Hold)';
        });

        // Periodic pin state polling (M119 every 400ms from probe-widget)
        setInterval(function() {
            if (port && socket.connected) {
                socket.emit('writeln', port, 'M119', { source: 'probe-widget' });
            }
        }, 400);

        // Keep parent room connection fresh
        setInterval(function() {
            if (socket.connected && !port) {
                joinRoom();
            }
        }, 3000);
    })();
    </script>
</body>
</html>
